<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Valida SETIC: camada central de validação e padronização de dados do Governo de Rondônia.">
  <title>CAGD · Valida SETIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Cabeçalho com navegação entre as páginas -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/><path d="m9 12 2 2 4-4"/></svg>
      </span>
      <div>
        <h1 class="brand-title"><a href="./">Valida <span>SETIC</span></a></h1>
        <p class="brand-sub">Qualidade de dados · Governo de Rondônia</p>
      </div>
    </div>

    <nav class="tabs" aria-label="Páginas da aplicação">
      <a class="tab" href="sistema-a.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>
        Sistema A
      </a>
      <a class="tab active" aria-current="page" href="cagd.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Gestão de Regras (CAGD)
      </a>
    </nav>
  </header>

  <main class="container">
    <section class="view active" id="view-cagd">
      <div class="card glass card-wide">
        <div class="card-header card-header-row">
          <div>
            <span class="chip">CAGD</span>
            <h2>Gestão de Regras</h2>
            <p class="muted">Defina quais campos são obrigatórios. A mudança vale na próxima validação de todos os sistemas.</p>
          </div>
          <button type="button" class="btn btn-ghost" id="btn-recarregar-regras" aria-label="Recarregar regras">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>
            Recarregar
          </button>
        </div>

        <div class="alert alert-error hidden" id="regras-alerta" role="alert"></div>

        <div class="rules-grid" id="rules-grid" aria-live="polite">
          <!-- Cards gerados via JavaScript a partir do GET /regras -->
        </div>
      </div>
    </section>
  </main>

  <!-- Contêiner de toasts -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="js/comum.js"></script>
  <script src="js/cagd.js"></script>
</body>
</html>
