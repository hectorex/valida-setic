# Hospedagem no Render (plano grátis). No painel do Render: New > Blueprint > este repositório.
# Cada merge na main publica de novo automaticamente.
services:
  - type: web
    name: valida-setic
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # O seed recria o histórico fictício do painel; as regras padrão são criadas na subida.
    # Sem VALIDA_DB_URL, usa SQLite no disco do plano grátis, que é apagado a cada reinício (o site volta limpo).
    # Com VALIDA_DB_URL (PostgreSQL do Render), regras e cadastros sobrevivem aos reinícios; o seed só refaz o
    # histórico do painel.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /saude
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Usuários da CAGD (usuario:Nome:senha;...). O valor NÃO fica no repositório (que é público): defina no
      # painel do Render, em Environment. O histórico de regras registra o nome de quem fez cada mudança.
      - key: VALIDA_USUARIOS_CAGD
        sync: false
      # Senha única antiga: só vale enquanto VALIDA_USUARIOS_CAGD não existir (vira o usuário "cagd").
      # Sem nenhuma das duas, a CAGD fica aberta para qualquer pessoa com o link.
      - key: VALIDA_SENHA_CAGD
        sync: false
      # Chave por sistema no POST /validar (sistema:chave;...). Estas duas são de DEMONSTRAÇÃO e públicas de
      # propósito: aparecem no código do Sistema B e da página Como integrar, que chamam a API pelo navegador.
      # Em produção, cada sistema guarda a sua chave no próprio servidor. O Sistema A não precisa de chave
      # (o /cadastros valida por dentro).
      # PostgreSQL: cole aqui a "Internal Database URL" do banco criado no Render (New > PostgreSQL > Free).
      # Contém senha: só no painel do Render, nunca no repositório. Apagar a variável volta para o SQLite.
      - key: VALIDA_DB_URL
        sync: false
      - key: VALIDA_CHAVES_SISTEMAS
        value: sistema_b:demo-sistema-b;sistema_exemplo:demo-exemplo
